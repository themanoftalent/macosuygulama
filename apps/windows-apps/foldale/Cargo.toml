[package]
name = "foldale"
version = "1.0.0"
edition = "2021"
description = "Foldale - Windows Floating Drop Shelf"
authors = ["Mehmet Akif Çifçi <themanoftalent@users.noreply.github.com>"]

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse"
]
